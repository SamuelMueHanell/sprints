<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panto</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
   <main class="main">
        <section class="hero">
            <header class="header">
                <h2 class="header__logo">Panto</h2>
                <nav class="header__nav">
                    <a href="#" class="header__nav-link">About Us</a>
                    <a href="#" class="header__nav-link">Best products</a>
                    <a href="#" class="header__nav-link">Reviews</a>
                </nav>
                <button class="header__cart">
                    <img class="header__cart-icon" src="assets/icons/cart.svg" alt="cart__button">
                </button>
            </header>
            <div class="hero__content">
                <div class="hero__text">
                    <h1 class="hero__title">Make your interior more minimalistic & modern</h1>
                    <p class="hero__description">Turn your room with panto into a lot more minimalist and modern with ease and speed</p>
                </div>
                
                <label class="hero__search">
                    <input class="hero__search-input" type="search" placeholder="Search furniture">
                    <button class="hero__search-button">
                        <img class="hero__search-icon" src="assets/icons/search.svg" alt="search__button">
                    </button>
                </label>
            </div>
        </section>
   </main>
</body>
</html>
